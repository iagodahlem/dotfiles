name: container-ci

on:
  push:
    branches:
      - "**"
  pull_request:

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Shellcheck (containerized)
        run: |
          docker run --rm \
            -v "$PWD:/work" \
            -w /work \
            koalaman/shellcheck-alpine:stable \
            sh -c 'shellcheck scripts/*.sh scripts/utils/*.sh ci/*.sh os/*.sh containers/entrypoint.sh overlays/host/*/install.sh'

  dry-run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Installer dry run
        run: ci/dry-run.sh

  shell-startup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build the Ubuntu image
        run: docker build -f containers/Dockerfile -t dotfiles-devbox .

      # prints numbers and gates nothing: the runner's speed is not the author's, and the image has no mise, atuin or Homebrew
      - name: Shell startup
        run: |
          docker run --rm dotfiles-devbox bash -c '"$HOME/.dotfiles/ci/shell-startup.sh" -n 20'
          docker run --rm dotfiles-devbox bash -c '"$HOME/.dotfiles/ci/shell-startup.sh" --profile'

  devbox-smoke:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ubuntu
            dockerfile: containers/Dockerfile
          - name: arch
            dockerfile: containers/Dockerfile.arch
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build and Smoke Test (${{ matrix.name }})
        env:
          IMAGE_NAME: dotfiles-devbox-${{ matrix.name }}
          DOCKERFILE: ${{ matrix.dockerfile }}
        run: ci/devbox-smoke.sh
