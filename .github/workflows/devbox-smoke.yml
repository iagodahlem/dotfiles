name: container-ci

on:
  push:
    branches:
      - "**"
  pull_request:

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Shellcheck (containerized)
        run: |
          docker run --rm \
            -v "$PWD:/work" \
            -w /work \
            koalaman/shellcheck-alpine:stable \
            ./scripts/lint-shell.sh

  devbox-smoke:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ubuntu
            dockerfile: containers/Dockerfile
          - name: arch
            dockerfile: containers/Dockerfile.arch
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build and Smoke Test (${{ matrix.name }})
        env:
          IMAGE_NAME: dotfiles-devbox-${{ matrix.name }}
          DOCKERFILE: ${{ matrix.dockerfile }}
        run: scripts/devbox-smoke.sh
