# rebind prefix key (the nested sessions block at the bottom sets it to None once tpm has run)
set -g prefix C-a

# mouse mode keys
bind m set -g mouse on
bind M set -g mouse off

# use vi keybindings in copy and choice modes
setw -g mode-keys vi
bind-key -T copy-mode-vi 'v' send -X begin-selection
bind-key -T copy-mode-vi 'y' send -X copy-pipe-and-cancel 'xclip -in -selection clipboard'

# use zsh as default shell
set-option -g default-shell /bin/zsh

# plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'dracula/tmux'

# continuum
set -g @continuum-restore 'on'

# dracula
set -g @dracula-plugins 'cpu-usage gpu-usage ram-usage'
set -g @dracula-show-powerline true
set -g @dracula-show-flags true
set -g @dracula-refresh-rate 1
set -g @dracula-show-left-icon session
set -g @dracula-left-icon-padding '0'

white='#f8f8f2'
gray='#44475a'
dark_gray='#282a36'
light_purple='#bd93f9'
dark_purple='#6272a4'
cyan='#8be9fd'
green='#50fa7b'
orange='#ffb86c'
red='#ff5555'
pink='#ff79c6'
yellow='#f1fa8c'

left_sep=""

# initialize TMUX plugin manager (keep this line below every plugin setting and above the nested
# sessions block, which overrides what the plugins set)
# scripts/install-shell.sh clones tpm into $TMUX_PLUGIN_MANAGER_PATH, set in config/zsh/.zshenv
run "$TMUX_PLUGIN_MANAGER_PATH/tpm/tpm"

# nested sessions: each root key is decided per press from the pane's foreground command, so
# there is nothing to toggle and a remote session that ended needs no cleanup. in a pane running
# ssh, mosh-client or tmux, C-a and the window keys go to the program inside and C-b is this
# tmux's prefix; in any other pane C-a is the prefix and C-b goes to the program
# (below tpm on purpose: tmux-sensible builds its keys from the prefix while it loads and cannot
# bind None, and the dracula theme sets its own status-left)
%hidden remote="#{m/r:^(mosh-client|ssh|tmux)$,#{pane_current_command}}"
set -g prefix None
bind -n C-a if -F "$remote" 'send-keys C-a' 'switch-client -T prefix'
bind -n C-b if -F "$remote" 'switch-client -T prefix' 'send-keys C-b'
bind C-a send-keys C-a
bind C-b send-keys C-b

bind -n C-t if -F "$remote" 'send-keys C-t' 'new-window -a -c "#{pane_current_path}"'
bind -n S-left if -F "$remote" 'send-keys S-left' 'previous-window'
bind -n S-right if -F "$remote" 'send-keys S-right' 'next-window'
bind -n S-C-left if -F "$remote" 'send-keys S-C-left' 'swap-window -t -1'
bind -n S-C-right if -F "$remote" 'send-keys S-C-right' 'swap-window -t +1'

# status-left is one format for both states: a green segment with the session name, yellow while
# the prefix waits, and dimmed with "→ remote" while the pane runs a remote session
set -g status-left "#[bg=${green},fg=${dark_gray}]#{?${remote},#[bg=${dark_purple}]#[fg=${white}],}#{?client_prefix,#[bg=${yellow}]#[fg=${dark_gray}],} #S#{?${remote}, → remote,} #[fg=${green},bg=${gray}]#{?${remote},#[fg=${dark_purple}],}#{?client_prefix,#[fg=${yellow}],}${left_sep}"
