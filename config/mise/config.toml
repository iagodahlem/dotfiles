# Global mise config, linked to ~/.config/mise/config.toml by scripts/install-dotfiles.sh.
# scripts/install-mise.sh installs node, pnpm and bun from here; the go and rust pins wait for an explicit `mise install`.
# Ruby has no global pin here; each project pins its own Ruby.
# Keep the values one line each, install-mise.sh reads this table line by line.

[tools]
node = "lts"
pnpm = "latest"
bun = "latest"
go = "1.27.3"
rust = "1.99.1"
